[project]
name = "calm-paper"
version = "1.0.0"
description = "Experiments behind 'Interpretability-by-Design with Accurate Locally Additive Models and Conditional Feature Effects' (CALM, NeurIPS 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vasilis Gkolemis", email = "vgkolemis@athenarc.gr" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    # the method
    "calm-additive==0.1.0",
    "effector==0.6.0",
    # the models it is compared with
    "xgboost==3.2.0",
    "interpret==0.7.8",
    # numerics
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "joblib==1.5.3",
    # dataset sources
    "openml==0.15.1",
    "pmlb==1.0.1.post3",
    "ucimlrepo==0.0.7",
    "aif360==0.6.1",
    # the rest
    "pyyaml",
    "matplotlib",
]

[project.scripts]
calm-paper = "calm_paper.cli:main"

[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "calm_paper"

[tool.uv]
# the runs were made on Linux x86-64; the lock is resolved for that platform only
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# every transitive dependency at the version the frozen runs used
